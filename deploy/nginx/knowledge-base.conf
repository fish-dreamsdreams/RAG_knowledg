# 知识库管理平台 —— nginx 站点配置（生产形态）
#
# 安装：
#   sudo cp deploy/nginx/knowledge-base.conf /etc/nginx/conf.d/knowledge-base.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 前置：① 前端已 build（frontend/dist）② 后端 uvicorn 在 127.0.0.1:8000（kb-api.service）。
# 落盘前改三处：下面 server_name、root，以及需要时调 client_max_body_size。
#
# 上 HTTPS 时把本文件复制成 443 的 server 块（或交给 certbot 改），
# WebSocket 会跟着页面协议自动用 wss——前端按同源拼地址，不需要另配。

# 只有真的带 Upgrade 头（WebSocket 握手）才转发 upgrade，
# 普通 XHR 走 close：少一个常驻连接，也避免某些代理把普通请求当长连接挂着。
# conf.d/*.conf 是被 include 进 http 块的，所以 map 写在同级这里合法。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name kb.example.com;              # TODO: 换成实际域名（没有域名就填 _）

    # 前端构建产物。Vite 产物文件名带 hash，index.html 除外（见下面的 no-cache）
    root /opt/kb-platform/frontend/dist;     # TODO: 换成实际路径
    index index.html;

    # 入口页不缓存：否则发版后浏览器还在跑旧的 hash 引用，页面白屏或报 404。
    # 用 expires -1 而不是 add_header——location 里一出现 add_header，
    # server 级那几条安全头就不会再继承了。
    location = /index.html {
        expires -1;
    }

    # 带 hash 的 js/css 可以长缓存
    location /assets/ {
        expires 30d;
    }

    # API 与 WebSocket 都在这一个前缀下：
    #   REST   /api/v1/...
    #   WS     /api/v1/ws/chat   ← AI 工作台的流式问答
    # 少了 Upgrade / Connection 这两行，WS 握手建不起来，前端会一直转圈，
    # 而后端日志里什么都看不到——这是本项目最容易踩的部署坑。
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 问答是长连接：后端空闲 10 分钟才断，这里必须比它长
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;

        # 导入接口一次可带多个文件（单文件上限 20MB），nginx 默认 1m 会直接 413。
        # 理论峰值是「一批 50 个文件 × 20MB」，按实际批量调：不够就调大这里，
        # 或把前端的分批大小调小。
        client_max_body_size 256m;
    }

    # 前端是 history 路由：直接刷新 /dashboard 这类子页要回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 首屏那个 1.5MB 的 JS 分包 gzip 后约 480KB
    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
